<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<form method="post">
    {% csrf_token %}
    <br><br><br><br><br><br>
    <div align="center">
        <div style="height: 30px;">
            <h3><font color="green">{{ form.message }}</font></h3>
        </div>
        <h1>Login</h1>
        <table>
            <tr>
                <th>Login id</th>
                <td><input type="text" name="loginId" value="{{form.login_id}}"></td>
                <td style="position: fixed;"><font color="red">{{ form.input_error.login_id }}</font></td>
            </tr>
            <tr>
                <th>Password</th>
                <td><input type="password" name="password" value="{{form.password}}"></td>
                <td style="position: fixed;"><font color="red">{{ form.input_error.password }}</font></td>
            </tr>
            <tr>
                <th></th>
                <td><input type="submit" value="login" style="signIn"></td>
            </tr>
        </table>
    </div>

</form>

</body>
</html>
